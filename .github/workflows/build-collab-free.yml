name: Build Collaboration Free APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-collab-free.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download source package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o src.zip \
            "https://drive.google.com/uc?export=download&id=1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO" \
            || curl -L --fail --retry 3 -o src.zip \
            "https://drive.google.com/uc?export=download&confirm=t&id=1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO"
          if file src.zip | grep -qi html; then
            CONFIRM=$(grep -oP 'confirm=\K[^&]+' src.zip | head -1 || true)
            curl -L --fail --retry 3 -o src.zip \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM:-t}&id=1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO"
          fi
          file src.zip
          ls -lh src.zip

      - name: Extract source
        run: |
          mkdir -p work && unzip -q src.zip -d work
          if [ -d work/source ]; then
            SRC=work/source
            SIGN=work/signing
          else
            SRC=work
            SIGN=work/signing
          fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "SIGN=$SIGN" >> $GITHUB_ENV
          ls -la work | head

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Make Gradle executable
        run: chmod +x "$SRC/gradlew"

      - name: Prepare collaboration signing
        run: |
          PASS=$(cat "$SIGN/keystore-password.txt" | tr -d '\r\n')
          echo "COLLAB_KEYSTORE_FILE=$SIGN/aether-collaboration.p12" >> $GITHUB_ENV
          echo "COLLAB_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "COLLAB_KEY_ALIAS=aether-collaboration" >> $GITHUB_ENV
          echo "COLLAB_KEY_PASSWORD=$PASS" >> $GITHUB_ENV

      - name: Patch release signing if needed
        working-directory: ${{ env.SRC }}
        run: |
          if ! grep -q 'create("collaboration")' app/build.gradle.kts; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          t = t.replace(
              '    signingConfigs {\n        create("nightly") {',
              '''    signingConfigs {
          create("collaboration") {
              val collabStore = localOrEnv("collab.storeFile", "COLLAB_KEYSTORE_FILE")
              val collabPass = localOrEnv("collab.storePassword", "COLLAB_KEYSTORE_PASSWORD")
              val collabAlias = localOrEnv("collab.keyAlias", "COLLAB_KEY_ALIAS").ifBlank { "aether-collaboration" }
              val collabKeyPass = localOrEnv("collab.keyPassword", "COLLAB_KEY_PASSWORD").ifBlank { collabPass }
              if (collabStore.isNotBlank() && collabPass.isNotBlank()) {
                  storeFile = file(collabStore)
                  storePassword = collabPass
                  keyAlias = collabAlias
                  keyPassword = collabKeyPass
              }
          }
          create("nightly") {''',
              1,
          )
          if 'signingConfigs.findByName("collaboration")' not in t:
              t = t.replace(
                  'isShrinkResources = true\n            manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"\n            manifestPlaceholders["appRoundIcon"] = "@mipmap/ic_launcher_round"\n            manifestPlaceholders["appLabel"] = "@string/collab_app_name"\n            proguardFiles(',
                  'isShrinkResources = true\n            signingConfig = signingConfigs.findByName("collaboration")\n            manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"\n            manifestPlaceholders["appRoundIcon"] = "@mipmap/ic_launcher_round"\n            manifestPlaceholders["appLabel"] = "@string/collab_app_name"\n            proguardFiles(',
                  1,
              )
          p.write_text(t)
          print("patched")
          PY
          fi

      - name: Build release APK
        working-directory: ${{ env.SRC }}
        env:
          COLLAB_KEYSTORE_FILE: ${{ env.COLLAB_KEYSTORE_FILE }}
          COLLAB_KEYSTORE_PASSWORD: ${{ env.COLLAB_KEYSTORE_PASSWORD }}
          COLLAB_KEY_ALIAS: ${{ env.COLLAB_KEY_ALIAS }}
          COLLAB_KEY_PASSWORD: ${{ env.COLLAB_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace -Paether.versionName="2.1.9-free"

      - name: Collect APK
        run: |
          mkdir -p dist
          find "$SRC" -name "*.apk" -path "*/outputs/apk/*" -print || true
          APK=$(find "$SRC/app/build/outputs/apk" -name "*.apk" | head -1)
          cp "$APK" dist/Aether-Collaboration-2.1.9-free.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Collaboration-2.1.9-free
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.9-free
          name: Aether Collaboration 2.1.9-free
          body: |
            Free Pollinations models (openai / openai-fast) without API key.
            Signed with collaboration keystore.
          files: dist/Aether-Collaboration-2.1.9-free.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
