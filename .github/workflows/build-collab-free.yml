name: Build Collaboration Free APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download source package (gdown)
        shell: bash
        run: |
          set -euo pipefail
          pip install -q gdown
          # File must be shared as "Anyone with the link" on Google Drive
          gdown "1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO" -O src.zip --fuzzy || \
            gdown "https://drive.google.com/uc?id=1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO" -O src.zip
          ls -lh src.zip
          unzip -t src.zip | head -5

      - name: Extract source
        run: |
          mkdir -p work && unzip -q src.zip -d work
          if [ -d work/source ]; then SRC=work/source; SIGN=work/signing
          else SRC=work; SIGN=work/signing; fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "SIGN=$SIGN" >> $GITHUB_ENV
          test -f "$SRC/gradlew"
          test -f "$SIGN/aether-collaboration.p12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Make Gradle executable
        run: chmod +x "$SRC/gradlew"

      - name: Prepare collaboration signing
        run: |
          PASS=$(tr -d '\r\n' < "$SIGN/keystore-password.txt")
          echo "COLLAB_KEYSTORE_FILE=$SIGN/aether-collaboration.p12" >> $GITHUB_ENV
          echo "COLLAB_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "COLLAB_KEY_ALIAS=aether-collaboration" >> $GITHUB_ENV
          echo "COLLAB_KEY_PASSWORD=$PASS" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: ${{ env.SRC }}
        env:
          COLLAB_KEYSTORE_FILE: ${{ env.COLLAB_KEYSTORE_FILE }}
          COLLAB_KEYSTORE_PASSWORD: ${{ env.COLLAB_KEYSTORE_PASSWORD }}
          COLLAB_KEY_ALIAS: ${{ env.COLLAB_KEY_ALIAS }}
          COLLAB_KEY_PASSWORD: ${{ env.COLLAB_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace -Paether.versionName="2.1.9-free"

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find "$SRC/app/build/outputs/apk" -name "*.apk" | head -1)
          cp "$APK" dist/Aether-Collaboration-2.1.9-free.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Collaboration-2.1.9-free
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.9-free
          name: Aether Collaboration 2.1.9-free
          body: Free Pollinations openai/openai-fast + collaboration signing
          files: dist/Aether-Collaboration-2.1.9-free.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
