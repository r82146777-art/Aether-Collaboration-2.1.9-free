name: Build Collaboration Free APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Download public source package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o src.zip \
            "https://drive.usercontent.google.com/download?id=1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO&export=download&confirm=t"
          ls -lh src.zip
          # must be a zip (PK)
          python3 -c "import sys; d=open('src.zip','rb').read(2); sys.exit(0 if d==b'PK' else 1)"

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p work && unzip -q src.zip -d work
          if [ -d work/source ]; then SRC=work/source; SIGN=work/signing
          else SRC=work; SIGN=work/signing; fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "SIGN=$SIGN" >> $GITHUB_ENV
          echo "SRC_ABS=$GITHUB_WORKSPACE/$SRC" >> $GITHUB_ENV
          echo "SIGN_ABS=$GITHUB_WORKSPACE/$SIGN" >> $GITHUB_ENV
          test -f "$SRC/gradlew"
          test -f "$SIGN/aether-collaboration.p12"

      - name: Apply free-provider fix from repo
        run: |
          set -euo pipefail
          cp patches/FreeProviderBootstrap.kt \
            "$SRC/shared/src/commonMain/kotlin/com/zhousl/aether/data/FreeProviderBootstrap.kt"
          python3 <<'PY'
          from pathlib import Path
          import os
          src = Path(os.environ["SRC"])
          p = src / "app/src/main/java/com/zhousl/aether/data/SettingsRepository.kt"
          t = p.read_text()
          t = t.replace(
              "if (merged.size != current.size) {\n                prefs[PROVIDER_CONFIGS] = serializeProviderConfigs(merged)\n            }",
              "prefs[PROVIDER_CONFIGS] = serializeProviderConfigs(merged)",
              1,
          )
          p.write_text(t)
          bg = src / "app/build.gradle.kts"
          bt = bg.read_text()
          bt = bt.replace('?: "2.1.9-free"', '?: "2.1.10-free"')
          bt = bt.replace("versionCode = 13", "versionCode = 14")
          bt = bt.replace("versionCode = 12", "versionCode = 14")
          bg.write_text(bt)
          print("patched ok")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Make Gradle executable
        run: chmod +x "$SRC/gradlew"

      - name: Install pi-bridge deps
        working-directory: ${{ env.SRC }}/pi-bridge
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Prepare collaboration signing
        run: |
          set -euo pipefail
          PASS=$(tr -d '\r\n' < "$SIGN_ABS/keystore-password.txt")
          echo "COLLAB_KEYSTORE_FILE=$SIGN_ABS/aether-collaboration.p12" >> $GITHUB_ENV
          echo "COLLAB_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "COLLAB_KEY_ALIAS=aether-collaboration" >> $GITHUB_ENV
          echo "COLLAB_KEY_PASSWORD=$PASS" >> $GITHUB_ENV

      - name: Ensure release signing in Gradle
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          if 'create("collaboration")' not in t:
              t = t.replace(
                  '    signingConfigs {\n        create("nightly") {',
                  '''    signingConfigs {
          create("collaboration") {
              val collabStore = localOrEnv("collab.storeFile", "COLLAB_KEYSTORE_FILE")
              val collabPass = localOrEnv("collab.storePassword", "COLLAB_KEYSTORE_PASSWORD")
              val collabAlias = localOrEnv("collab.keyAlias", "COLLAB_KEY_ALIAS").ifBlank { "aether-collaboration" }
              val collabKeyPass = localOrEnv("collab.keyPassword", "COLLAB_KEY_PASSWORD").ifBlank { collabPass }
              if (collabStore.isNotBlank() && collabPass.isNotBlank()) {
                  storeFile = file(collabStore)
                  storePassword = collabPass
                  keyAlias = collabAlias
                  keyPassword = collabKeyPass
              }
          }
          create("nightly") {''',
                  1,
              )
          if 'signingConfigs.findByName("collaboration")' not in t and 'getByName("collaboration")' not in t:
              t = t.replace(
                  'isShrinkResources = true\n            manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"',
                  'isShrinkResources = true\n            signingConfig = signingConfigs.findByName("collaboration")\n            manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"',
                  1,
              )
          p.write_text(t)
          print("gradle signing ready")
          PY

      - name: Build release APK
        working-directory: ${{ env.SRC }}
        env:
          COLLAB_KEYSTORE_FILE: ${{ env.COLLAB_KEYSTORE_FILE }}
          COLLAB_KEYSTORE_PASSWORD: ${{ env.COLLAB_KEYSTORE_PASSWORD }}
          COLLAB_KEY_ALIAS: ${{ env.COLLAB_KEY_ALIAS }}
          COLLAB_KEY_PASSWORD: ${{ env.COLLAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace -Paether.versionName="2.1.10-free" 2>&1 | tee /tmp/gradle-build.log
          tail -40 /tmp/gradle-build.log

      - name: Collect APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find "$SRC/app/build/outputs/apk" -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/Aether-Collaboration-2.1.10-free.apk
          ls -lh dist/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Collaboration-2.1.10-free
          path: dist/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.10-free
          name: Aether Collaboration 2.1.10-free
          body: |
            Fix: Unknown built-in Pi provider — free models use openai-compatible.
          files: dist/Aether-Collaboration-2.1.10-free.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
