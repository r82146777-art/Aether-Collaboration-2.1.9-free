name: Build Collaboration Free APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Download public source package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o src.zip \
            "https://drive.usercontent.google.com/download?id=1SvWuohjPZ3hmi73vyaldpCEdVt98fiBO&export=download&confirm=t"
          ls -lh src.zip
          python3 -c "import sys; d=open('src.zip','rb').read(2); sys.exit(0 if d==b'PK' else 1)"

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p work && unzip -q src.zip -d work
          if [ -d work/source ]; then SRC=work/source; SIGN=work/signing
          else SRC=work; SIGN=work/signing; fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "SIGN=$SIGN" >> $GITHUB_ENV
          echo "SRC_ABS=$GITHUB_WORKSPACE/$SRC" >> $GITHUB_ENV
          echo "SIGN_ABS=$GITHUB_WORKSPACE/$SIGN" >> $GITHUB_ENV
          test -f "$SRC/gradlew"
          test -f "$SIGN/aether-collaboration.p12"

      - name: Apply free-provider fix from repo
        run: |
          set -euo pipefail
          cp patches/FreeProviderBootstrap.kt \
            "$SRC/shared/src/commonMain/kotlin/com/zhousl/aether/data/FreeProviderBootstrap.kt"
          if [ -f "$SRC/pi-bridge/src/collaboration.ts" ]; then
            sed -i 's/AbortSignal.timeout(110_000)/AbortSignal.timeout(300_000)/g' "$SRC/pi-bridge/src/collaboration.ts" || true
            sed -i 's/AbortSignal.timeout(48_000)/AbortSignal.timeout(180_000)/g' "$SRC/pi-bridge/src/collaboration.ts" || true
          fi
          python3 <<'PY'
          from pathlib import Path
          import os, re
          src = Path(os.environ["SRC"])
          p = src / "app/src/main/java/com/zhousl/aether/data/SettingsRepository.kt"
          t = p.read_text()
          t = t.replace(
              "if (merged.size != current.size) {\n                prefs[PROVIDER_CONFIGS] = serializeProviderConfigs(merged)\n            }",
              "prefs[PROVIDER_CONFIGS] = serializeProviderConfigs(merged)",
              1,
          )
          # Force active free provider to write non-empty API key into prefs every startup
          old = """val activeId = prefs[PROVIDER_CONFIG_ID].orEmpty()
            if (activeId.isBlank() || merged.none { it.id == activeId }) {
                val free = merged.firstOrNull { it.id == FreeProviderBootstrap.POLLINATIONS_OPENAI_ID }
                    ?: merged.firstOrNull()
                if (free != null) {
                    prefs[PROVIDER_CONFIG_ID] = free.id
                    prefs[PI_PROVIDER_ID] = free.piProviderId
                    prefs[PROVIDER_AUTH_METHOD] = free.authMethod.storageValue
                    prefs[API_KEY] = free.apiKey
                    prefs[BASE_URL] = free.baseUrl
                    prefs[MODEL_ID] = free.modelId
                }
            }"""
          new = """val activeId = prefs[PROVIDER_CONFIG_ID].orEmpty()
            val active = merged.firstOrNull { it.id == activeId }
            val freeIds = setOf(
                FreeProviderBootstrap.POLLINATIONS_OPENAI_ID,
                FreeProviderBootstrap.POLLINATIONS_FAST_ID,
                FreeProviderBootstrap.LLM7_ID,
            )
            val needsFree = active == null || activeId.isBlank() ||
                active.piProviderId in setOf("pollinations", "pollinations-fast", "llm7") ||
                (activeId in freeIds && active.apiKey.isBlank())
            if (needsFree) {
                val free = merged.firstOrNull { it.id == FreeProviderBootstrap.POLLINATIONS_FAST_ID }
                    ?: merged.firstOrNull { it.id == FreeProviderBootstrap.POLLINATIONS_OPENAI_ID }
                    ?: merged.firstOrNull()
                if (free != null) {
                    prefs[PROVIDER_CONFIG_ID] = free.id
                    prefs[PI_PROVIDER_ID] = free.piProviderId
                    prefs[PROVIDER_AUTH_METHOD] = free.authMethod.storageValue
                    prefs[API_KEY] = free.apiKey.ifBlank { "pollinations" }
                    prefs[BASE_URL] = free.baseUrl
                    prefs[MODEL_ID] = free.modelId
                }
            } else if (active != null && activeId in freeIds) {
                // Always refresh free provider credentials from template
                prefs[PI_PROVIDER_ID] = active.piProviderId
                prefs[PROVIDER_AUTH_METHOD] = active.authMethod.storageValue
                prefs[API_KEY] = active.apiKey.ifBlank { "pollinations" }
                prefs[BASE_URL] = active.baseUrl
                if (active.modelId.isNotBlank()) prefs[MODEL_ID] = active.modelId
            }"""
          if old in t:
              t = t.replace(old, new, 1)
              print("ensureFreeProviders body replaced")
          else:
              print("WARN: ensureFreeProviders pattern not exact; only size-fix applied")
          p.write_text(t)
          bg = src / "app/build.gradle.kts"
          bt = bg.read_text()
          for a,b in [('?: "2.1.9-free"','?: "2.1.12-free"'),('?: "2.1.10-free"','?: "2.1.12-free"'),('?: "2.1.11-free"','?: "2.1.12-free"'),('versionCode = 12','versionCode = 16'),('versionCode = 13','versionCode = 16'),('versionCode = 14','versionCode = 16'),('versionCode = 15','versionCode = 16')]:
              bt = bt.replace(a,b)
          bg.write_text(bt)
          print("patched ok")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Make Gradle executable
        run: chmod +x "$SRC/gradlew"

      - name: Install pi-bridge deps
        working-directory: ${{ env.SRC }}/pi-bridge
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Prepare collaboration signing
        run: |
          set -euo pipefail
          PASS=$(tr -d '\r\n' < "$SIGN_ABS/keystore-password.txt")
          echo "COLLAB_KEYSTORE_FILE=$SIGN_ABS/aether-collaboration.p12" >> $GITHUB_ENV
          echo "COLLAB_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "COLLAB_KEY_ALIAS=aether-collaboration" >> $GITHUB_ENV
          echo "COLLAB_KEY_PASSWORD=$PASS" >> $GITHUB_ENV

      - name: Ensure release signing in Gradle
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          if 'create("collaboration")' not in t:
              t = t.replace(
                  '    signingConfigs {\n        create("nightly") {',
                  '    signingConfigs {\n        create("collaboration") {\n            val collabStore = localOrEnv("collab.storeFile", "COLLAB_KEYSTORE_FILE")\n            val collabPass = localOrEnv("collab.storePassword", "COLLAB_KEYSTORE_PASSWORD")\n            val collabAlias = localOrEnv("collab.keyAlias", "COLLAB_KEY_ALIAS").ifBlank { "aether-collaboration" }\n            val collabKeyPass = localOrEnv("collab.keyPassword", "COLLAB_KEY_PASSWORD").ifBlank { collabPass }\n            if (collabStore.isNotBlank() && collabPass.isNotBlank()) {\n                storeFile = file(collabStore)\n                storePassword = collabPass\n                keyAlias = collabAlias\n                keyPassword = collabKeyPass\n            }\n        }\n        create("nightly") {',
                  1,
              )
          if 'signingConfigs.findByName("collaboration")' not in t and 'getByName("collaboration")' not in t:
              t = t.replace(
                  'isShrinkResources = true\n            manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"',
                  'isShrinkResources = true\n            signingConfig = signingConfigs.findByName("collaboration")\n            manifestPlaceholders["appIcon"] = "@mipmap/ic_launcher"',
                  1,
              )
          p.write_text(t)
          print("gradle signing ready")
          PY

      - name: Build release APK
        working-directory: ${{ env.SRC }}
        env:
          COLLAB_KEYSTORE_FILE: ${{ env.COLLAB_KEYSTORE_FILE }}
          COLLAB_KEYSTORE_PASSWORD: ${{ env.COLLAB_KEYSTORE_PASSWORD }}
          COLLAB_KEY_ALIAS: ${{ env.COLLAB_KEY_ALIAS }}
          COLLAB_KEY_PASSWORD: ${{ env.COLLAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace -Paether.versionName="2.1.12-free" 2>&1 | tee /tmp/gradle-build.log
          tail -40 /tmp/gradle-build.log

      - name: Collect APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find "$SRC/app/build/outputs/apk" -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/Aether-Collaboration-2.1.12-free.apk
          ls -lh dist/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Collaboration-2.1.12-free
          path: dist/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.12-free
          name: Aether Collaboration 2.1.12-free
          body: |
            Root fix: free providers now send a dummy non-empty API key so Pi accepts them.
            Pollinations ignores the key; openai-compatible requires it.
          files: dist/Aether-Collaboration-2.1.12-free.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
